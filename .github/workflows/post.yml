name: Publier un post Vinea

on:
  schedule:
    # Tous les jours à 17h07 UTC (18h07 à Paris l'hiver, 19h07 l'été) : 1 publication par jour,
    # reel et post en alternance. (GitHub peut décaler le lancement de quelques minutes.)
    - cron: "7 17 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Publier maintenant, même si une publication a déjà eu lieu aujourd'hui"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      # 1 publication par jour : on accepte un écart de 20 h (le cron peut être retardé)
      MIN_HOURS_BETWEEN_POSTS: 20
      IG_METHOD: ${{ vars.IG_METHOD || 'graph' }} # graph | instagrapi | off
      HAS_PAT: ${{ secrets.GH_PAT != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # ffmpeg sert à assembler les reels (images + musique -> MP4)
      - name: Installer ffmpeg
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Préparer le prochain post
        id: prep
        run: node src/run.js prepare
        env:
          FORCE: ${{ inputs.force }}

      # Les images doivent être en ligne pour que l'API Instagram puisse les télécharger.
      - name: Mettre les visuels en ligne
        if: steps.prep.outputs.has_post == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public
          git diff --cached --quiet || git commit -m "visuels : ${{ steps.prep.outputs.post_id }}"
          git push
          sleep 15

      - name: Installer instagrapi
        if: steps.prep.outputs.has_post == 'true' && env.IG_METHOD == 'instagrapi'
        run: pip install instagrapi "moviepy<2"

      - name: Publier
        if: steps.prep.outputs.has_post == 'true'
        run: node src/run.js publish
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_SESSION: ${{ secrets.IG_SESSION }}
          IG_USERNAME: ${{ secrets.IG_USERNAME }}
          IG_PASSWORD: ${{ secrets.IG_PASSWORD }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
          PYTHON: python3

      - name: Enregistrer l'historique
        if: always() && steps.prep.outputs.has_post == 'true'
        run: |
          git add state
          git diff --cached --quiet || git commit -m "publié : ${{ steps.prep.outputs.post_id }}"
          git pull --rebase
          git push

      # Le token Instagram expire après 60 jours : on le prolonge automatiquement
      # (nécessite le secret GH_PAT, un token GitHub avec le droit "Secrets: write" sur ce repo).
      - name: Prolonger le token Instagram
        if: steps.prep.outputs.has_post == 'true' && env.IG_METHOD == 'graph' && env.HAS_PAT == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          NEW=$(node -e "import('./src/publishers/instagram-graph.js').then(m => m.refreshInstagramToken()).then(t => process.stdout.write(t))")
          echo "::add-mask::$NEW"
          gh secret set IG_ACCESS_TOKEN --body "$NEW" --repo "$GITHUB_REPOSITORY"
