      kicker: Expériences
      text: "Un vin a meilleur goût quand tu as serré la main de celui qui l'a fait."
      textSize: 72
  caption: |
    Vinea, ce n'est pas qu'une boutique de vins. C'est aussi une marketplace d'expériences 🍇

    Visite de cave, dégustation avec le vigneron, participation aux vendanges, ateliers accords mets-vins… Autant d'occasions de découvrir les domaines près de chez toi autrement.

    Tu préférerais quoi : une journée de vendanges ou une dégustation au coucher du soleil ?
  hashtags: [oenotourisme, degustation, experiencevin]

