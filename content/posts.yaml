- id: soutenir-les-domaines
  ready: true
  slides:
    - template: cover
      theme: vine
      kicker: Soutenir le local
      title: "Soutenir un domaine,\nce n'est pas\nfaire un don."
      subtitle: "C'est investir dans ce que tu bois,\net payer ton vin moins cher."
      titleSize: 96
  caption: |
    Sur Vinea, tu peux soutenir financièrement les domaines près de chez toi.

    Pourquoi c'est important ? Parce que les petits domaines portent seuls des investissements lourds : matériel, conversion en bio, reprise par une nouvelle génération…

    Toi, tu les aides à se développer. Eux, ils continuent à faire le vin que tu aimes. Et tu profites de bouteilles moins chères qu'en grande surface. Tout le monde y gagne. 🤝
  hashtags: [soutienlocal, economielocale]

- id: reperer-domaine-sous-cote
