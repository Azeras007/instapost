- id: lexique-vigneron-negociant
  ready: true
  slides:
    - template: list
      theme: cream
      kicker: Petit lexique
      title: "Qui a vraiment fait\nton vin ?"
      items:
        - title: Vigneron indépendant
          text: "Il cultive ses vignes, fait son vin et le met en bouteille lui-même."
        - title: Négociant
          text: "Il achète raisins ou vins à d'autres producteurs, puis les assemble et les vend sous sa marque."
        - title: Cave coopérative
          text: "Plusieurs viticulteurs mettent en commun leurs raisins et leur vinification."
  caption: |
    Sur l'étiquette, ce n'est pas toujours évident de savoir qui a fait ton vin 🧐

    🍇 Vigneron indépendant : de la vigne à la bouteille
    🏷️ Négociant : achète, assemble et commercialise
    🤝 Coopérative : des vignerons qui mutualisent

    Aucun n'est « meilleur » par principe, mais c'est bien de savoir ce qu'on achète. Sur Vinea, tu sais toujours de quel domaine vient ta bouteille.
  hashtags: [lexiqueduvin, apprendrelevin]

