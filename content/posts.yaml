# File d'attente des posts. Publiés dans l'ordre du fichier, un tous les 2 jours.
# Seuls les posts "ready: true" sont publiés ; un post déjà publié (voir state/published.json) n'est jamais republié.
#
# Gabarits de slide disponibles (champ "template") :
#   cover   : kicker, title, subtitle
#   quote   : kicker, text, author
#   list    : kicker, title, items: [{title, text}]  (3-4 items max)
#   big     : kicker, big (mot/chiffre géant), title, text
#   domaine : number, name, location, tags: [...], text, price
#   cta     : title, text, button
# Options communes : theme (wine | cream | vine), image (ex: assets/photos/domaine.jpg -> photo en fond)
# Tailles ajustables si un texte déborde : titleSize, textSize, bigSize
#
# Légende : "caption" (commune) ; "linkedin: {caption: ...}" ou "instagram: {caption: ...}" pour surcharger par réseau.
# Un carrousel = plusieurs slides (10 max).

- id: manifeste
  ready: true
  slides:
    - template: quote
      theme: wine
      kicker: Notre conviction
      text: "Le meilleur vin de ta région est peut-être à 20 minutes de chez toi."
  caption: |
    On traverse la France pour des étiquettes connues… et on passe à côté du domaine du village d'à côté.

    Chez Vinea, on est convaincus d'une chose simple : les pépites sont souvent tout près. Des vignerons passionnés, sans budget pub, sans place en rayon, qui font des vins incroyables à des prix honnêtes.

    Notre mission : te les faire découvrir, et te permettre de les soutenir.

    Et toi, tu connais les domaines autour de chez toi ? 👇
  linkedin:
    caption: |
      On traverse la France pour des étiquettes connues… et on passe à côté du domaine du village d'à côté.

      Vinea part d'une conviction simple : les meilleurs vins sont souvent tout près. Des vignerons passionnés, sans budget marketing ni place en grande surface, qui produisent des vins remarquables à des prix justes.

      Nous construisons la marketplace qui relie directement les consommateurs aux domaines de leur région : achat de vins moins cher qu'en grande surface, expériences au domaine, et possibilité de soutenir financièrement les vignerons locaux.
  hashtags: [vinlocal, pepitesduvin]

- id: pourquoi-acheter-au-domaine
  ready: true
  slides:
    - template: list
      theme: cream
      kicker: Circuit court
      title: "Pourquoi acheter\ndirectement au domaine ?"
      items:
        - title: Un prix plus juste
          text: "Moins d'intermédiaires, moins de marges empilées.\nSouvent moins cher qu'en grande surface."
        - title: Un vigneron mieux payé
          text: "Ton argent va à celui qui a fait le vin."
        - title: Tu sais ce que tu bois
          text: "Qui, où, comment : tout est transparent."
  caption: |
    Acheter en direct, c'est payer le vin… pas le trajet, le stockage et les marges successives.

    ✔️ Un prix plus juste pour toi
    ✔️ Une meilleure rémunération pour le vigneron
    ✔️ Une traçabilité totale

    C'est exactement ce que Vinea rend simple : les domaines près de chez toi, au bout de ton doigt.
  hashtags: [achatdirect, vinpascher]

- id: mythe-bon-vin-cher
  ready: true
  slides:
    - template: big
      theme: vine
      kicker: Idée reçue
      big: Mythe
      title: "« Un bon vin coûte forcément cher. »"
      text: "Faux. Une partie du prix en rayon n'a rien à voir avec ce qu'il y a dans la bouteille : transport, distribution, marketing.\nEn direct du domaine, tu paies surtout le travail du vigneron."
  caption: |
    Idée reçue n°1 : un bon vin, c'est forcément un vin cher.

    En réalité, le prix d'une bouteille en magasin inclut beaucoup de choses qui ne sont pas dans ton verre : logistique, distribution, publicité, marges…

    Beaucoup de petits domaines produisent des vins excellents qu'ils vendent à prix doux, simplement parce qu'ils vendent en direct. 🍷

    Tu as déjà eu une belle surprise avec une bouteille pas chère ? Raconte-nous !
  hashtags: [ideerecue, bonplanvin]

