      title: "Comment repérer\nun domaine sous-coté"
      titleSize: 68
      items:
        - title: Regarde à côté des grands noms
          text: "Les appellations voisines des plus célèbres partagent souvent les mêmes sols, à des prix bien plus doux."
        - title: Suis les jeunes repreneurs
          text: "Nouvelle génération = nouvelles idées, et des prix encore raisonnables."
        - title: Ne juge pas l'étiquette
          text: "Pas de budget marketing ne veut pas dire pas de talent."
        - title: Va goûter sur place
          text: "Rien ne remplace une dégustation au domaine."
  caption: |
    Les domaines sous-cotés, c'est notre obsession chez Vinea. Voici nos 4 réflexes pour les dénicher 🔎

    1. Regarde les appellations voisines des grands noms
    2. Suis les jeunes vignerons qui reprennent un domaine
    3. Ne te fie pas au design de l'étiquette
    4. Va goûter sur place !

    Enregistre ce post pour ta prochaine balade dans les vignes 📌
  hashtags: [conseilvin, pepitesduvin]

