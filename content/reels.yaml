# File d'attente des REELS (vidéos 9:16 avec musique). Publiés en alternance avec les posts de posts.yaml.
# Seuls les reels "ready: true" sont publiés, dans l'ordre du fichier, jamais deux fois.
#
# look : identité visuelle du reel (tout est combinable)
#   palette    : bordeaux creme vigne nuit terracotta rose champagne encre pop olive lavande sunset mer craie kraft rubis menthe blanc
#   font       : classic poster bold elegant hand retro editorial brut modern vintage mono
#   bg         : flat bubbles grapes leaves stripes rays waves dots blobs grid rings confetti frame spotlight chalk sparkles checker
#   transition : fade slide up zoom spin wipe flash cut
#   hl         : color | box | underline   (style des *mots en valeur* dans les textes)
#   kicker     : bar | pill | plain        (style des petits surtitres)
#   brand      : top | bottom | none       (petit logo "vinea")
#   progress   : true                      (barre de progression en haut)
#
# music : musique originale générée (libre de droits), unique par reel
#   style : lofi house bossa ambient musette cinematic jazz chiptune folk trap synthwave funk piano reggae
#   options : seed (change le morceau), bpm, key (C D Eb E F G A Bb), ou file: assets/music/mon-son.mp3
#
# scenes : enchaînement de scènes animées (durée auto, ou "duration: 5")
#   title    : kicker, text, sub, anim (rise|words|type|zoom|slide|drop|fade), align (left|center)
#   bigword  : kicker, word, text            count   : kicker, from, to, unit, text, sub
#   list     : kicker, title, items, style (num|check|cross|arrow|bullet)
#   versus   : title, left, right, rows [[gauche, droite]]
#   glass    : text, fill (0-1), wine (rouge|blanc|rose), mark, sub
#   quote    : text, author              myth   : myth, truth
#   quiz     : question, options, answer (index), explain
#   timeline : title, steps [{when, what, text}]
#   map      : kicker, label, text       bars   : title, items [{label, value, level}], note
#   cards    : title, items [{tag, title, text}]      steps : title, items [{title, text}]
#   define   : word, phon, kind, def, example         split : a, b, cta
#   marquee  : words, text               bottle : title, items [{label, text}]
#   chat     : name, messages [{from: me|them, text}]
#   search   : query, results [{title, text}]         notifs : clock, date, items [{title, text, time}]
#   pairing  : kicker, items [{a, b, note}]           orbit  : text, words, sub
#   grid     : title, tiles [{title, text}]           flash  : words (un mot par temps de musique)
#   photo    : image (assets/photos/...), text        cta    : title, text, button
# Options de scène : duration, palette (fond différent pour cette scène), transition, brand: false
# Dans les textes, entoure un passage d'*astérisques* pour le mettre en valeur.

